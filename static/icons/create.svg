<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ef_icon_stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEEC0" />
      <stop offset="50%" stop-color="#F5B15C" />
      <stop offset="100%" stop-color="#FF7B3A" />
    </linearGradient>
  </defs>
  <g
    fill="none"
    stroke="url(#ef_icon_stroke)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- rounded timeline bar -->
    <rect x="3" y="9" width="18" height="6" rx="3" />
    <!-- playhead marker -->
    <line x1="10" y1="8" x2="10" y2="16" />
    <!-- small ticks -->
    <line x1="6" y1="9" x2="6" y2="11" />
    <line x1="14" y1="9" x2="14" y2="11" />
    <line x1="18" y1="9" x2="18" y2="11" />
  </g>
</svg>
