{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Project Settings</h2>
  <p class="help-text">Workspace: <span id="currentWorkspaceLabel"></span></p>
  <p class="help-text">Adjust project-level options here.</p>
  <div class="row">
    <a href="/dashboard" class="ghost-btn">Back to Dashboard</a>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('activeWorkspace') || 'Default';
      const el = document.getElementById('currentWorkspaceLabel');
      if (el) el.textContent = name;
    });
  </script>
{% endblock %}
