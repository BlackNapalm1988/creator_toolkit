name: Run Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: |
          export DISABLE_QUEUE_WORKER=1
          pytest -q --maxfail=1 --disable-warnings

      - name: Verify Agents file integrity
        run: |
          python - <<'PY'
          with open("docs/agents/AGENTS.md", encoding="utf-8") as f:
              text = f.read()
          for key in ["API Server (FastAPI App)",
                      "Worker Agent (Background Worker)",
                      "Dashboard / Visibility Layer"]:
              assert key in text, f"Missing core section: {key}"
          print("Agents.md integrity verified")
          PY
