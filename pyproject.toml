[project]
name = "creator-toolkit"
requires-python = ">=3.10"
dependencies = [
    "cryptography==46.0.3",
    "email-validator==2.3.0",
    "fastapi==0.121.0",
    "jinja2==3.1.6",
    "openai==2.6.1",
    "passlib[bcrypt]==1.7.4",
    "pydantic==2.9.2",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.2.1",
    "python-jose[cryptography]==3.4.0",
    "python-multipart==0.0.18",
    "requests==2.32.4",
    "starlette==0.49.3",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = [
    "black==24.8.0",
    "httpx==0.26.0",
    "pytest-asyncio==0.21.1",
    "pytest==7.4.4",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

# Exclude generated assets and documentation from linting/formatting.
extend-exclude = [
    "data",
    "docs/_build",
    "static",
    "templates",
    "releases",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # Handled by the formatter.
]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = ["email-validator", "jinja2", "python-multipart", "starlette", "uvicorn"]

