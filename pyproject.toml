[project]
name = "creator-toolkit"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

# Exclude generated assets and documentation from linting/formatting.
extend-exclude = [
    "data",
    "docs/_build",
    "static",
    "templates",
    "releases",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # Handled by the formatter.
]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"

